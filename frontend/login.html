<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - VibeMechanics</title>
<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<!-- FontAwesome para ícones -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="/frontend/css/estilo.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<!-- Barra de Navegação Fixa com Botão Voltar à Esquerda e Logo Centralizada -->
<nav class="navbar navbar-expand-lg fixed-top shadow-sm py-2 inline-style-10">
<div class="container-fluid px-4">
<div class="d-flex w-100 align-items-center justify-content-between position-relative">
<!-- Botão Voltar na Extremidade Esquerda com Seta Branca -->
<div>
<a class="text-white text-decoration-none fw-semibold d-inline-flex align-items-center gap-2" data-fallback="/" data-voltar="" href="#">
<i class="fa-solid fa-arrow-left text-white"></i> Voltar
                    </a>
</div>
<!-- Logo Perfeitamente Centralizada -->
<div class="position-absolute start-50 translate-middle-x">
<a class="navbar-brand fw-bold fs-3 brand-title m-0" href="#">
<span class="inline-style-2">Vibe</span><span class="inline-style-3">Mechanics</span>
</a>
</div>
<!-- Elemento invisível à direita para manter o balanceamento do flex -->
<div class="inline-style-11">
<span class="fw-semibold">Voltar</span>
</div>
</div>
</div>
</nav>
<!-- Conteúdo Principal do Login -->
<main class="container py-4 inline-style-12">
<div class="card shadow border-0">
<div class="card-body p-4">
<h3 class="fw-bold mb-4 text-center">Acessar Conta</h3>
<form id="form-login">
<div class="mb-3">
<label class="form-label" for="email">E-mail</label>
<input class="form-control" id="email" placeholder="exemplo@email.com" required="" type="email"/>
</div>
<div class="mb-4">
<label class="form-label" for="senha">Senha</label>
<input class="form-control" id="senha" placeholder="Digite sua senha" required="" type="password"/>
</div>
<button class="btn text-white w-100 fw-bold py-2 inline-style-4" id="btnEntrar" type="submit">Entrar</button>
<div class="text-danger mt-3 text-center fw-bold" id="mensagem"></div>
</form>
<div class="text-center mt-3">
<p class="text-muted">Ainda não tem uma conta? <a class="text-decoration-none fw-semibold inline-style-6" href="/cadastroCliente.html">Cadastre-se</a></p>
</div>
</div>
</div>
</main>
<!-- Script de Autenticação Externo -->
<script src="/frontend/js/navigation.js"></script><script src="/frontend/js/auth.js"></script><script src="/frontend/js/login.js"></script>
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
