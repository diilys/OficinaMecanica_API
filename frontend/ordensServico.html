<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordens de Serviço - Oficina Mecânica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Oficina Mecânica</a>
            <div>
                <a href="/" class="btn btn-light btn-sm me-2">Início</a>
                <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#modalOrdemServico" onclick="limparFormularioOS()">+ Nova OS</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold m-0">Ordens de Serviço</h1>
                <p class="text-muted m-0">Acompanhe os serviços cadastrados e gerados pelas Views do sistema.</p>
            </div>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalOrdemServico" onclick="limparFormularioOS()">+ Criar Nova OS</button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>OS nº</th>
                                <th>Cliente</th>
                                <th>Veículo / Placa</th>
                                <th>Descrição</th>
                                <th>Status</th>
                                <th>Valor Total (R$)</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaOrdensServico">
                            <!-- Preenchido via ordemServico.js com dados da View -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalOrdemServico" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalOSTitulo">Nova Ordem de Serviço</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form id="form-os">
                        <input type="hidden" id="os_id">
                        <div class="mb-3">
                            <label for="veiculo_id" class="form-label">ID do Veículo</label>
                            <input type="number" id="veiculo_id" class="form-control" placeholder="Ex: 1" required>
                        </div>
                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição do Serviço / Defeito</label>
                            <textarea id="descricao" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select id="status" class="form-select" required>
                                    <option value="Pendente">Pendente</option>
                                    <option value="Em Andamento">Em Andamento</option>
                                    <option value="Concluído">Concluído</option>
                                    <option value="Cancelado">Cancelado</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="valor_total" class="form-label">Valor Total (R$)</label>
                                <input type="number" step="0.01" id="valor_total" class="form-control" required>
                            </div>
                        </div>
                        <div id="mensagemOS" class="text-danger mb-3 text-center fw-bold"></div>
                        <button type="submit" class="btn btn-primary w-100" id="btnSalvarOS">Salvar OS</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/ordemServico.js"></script>
</body>
</html>
