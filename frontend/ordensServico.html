<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ordens de Serviço - VibeMechanics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="/frontend/css/estilo.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg fixed-top shadow-sm py-1 inline-style-1">
<div class="container-fluid px-4">
<div class="row w-100 align-items-center m-0">
<div class="col-4 d-flex align-items-center">
<a class="btn text-white p-0 fs-5 border-0 shadow-none d-flex align-items-center gap-2" data-fallback="/" data-voltar="" href="#">
<i class="fa-solid fa-arrow-left"></i> <span class="d-none d-sm-inline">Voltar</span>
</a>
</div>
<div class="col-4 text-center">
<a class="navbar-brand fw-bold fs-3 brand-title m-0" href="/">
<span class="inline-style-2">Vibe</span><span class="inline-style-3">Mechanics</span>
</a>
</div>
<div class="col-4 text-end">
<a class="btn text-white fw-bold shadow-sm inline-style-4" href="/cadastro-ordem-servico">
<i class="fa-solid fa-plus me-1"></i> <span class="d-none d-sm-inline">Nova Ordem de Serviço</span>
</a>
</div>
</div>
</div>
</nav>

<main class="container py-4 inline-style-5">
<div class="mb-4">
<h1 class="fw-bold m-0 inline-style-3">Gerenciamento de Ordens de Serviço</h1>
<p class="text-muted m-0">Consulte e gerencie as ordens de serviço da oficina.</p>
</div>

<div class="card shadow-sm border-0 mb-4">
<div class="card-body">
<h5 class="card-title fw-bold mb-3 inline-style-3">
<i class="fa-solid fa-magnifying-glass me-2 inline-style-6"></i>Filtrar Ordens de Serviço
</h5>
<div class="row g-3 align-items-end">
<div class="col-md-8">
<label class="form-label fw-semibold" for="pesquisaOS">Pesquisar</label>
<input class="form-control" id="pesquisaOS" placeholder="Cliente, placa, modelo ou descrição..." type="text"/>
</div>
<div class="col-md-4">
<label class="form-label fw-semibold" for="filtroStatusOS">Status</label>
<select class="form-select" id="filtroStatusOS">
<option value="">Todos</option>
<option value="pendente">Pendente</option>
<option value="em_andamento">Em andamento</option>
<option value="concluida">Concluída</option>
<option value="cancelada">Cancelada</option>
</select>
</div>
</div>
</div>
</div>

<div class="card shadow-sm border-0">
<div class="card-body">
<div class="table-responsive">
<table class="table table-hover align-middle">
<thead class="inline-style-7">
<tr>
<th>ID</th>
<th>Cliente</th>
<th>Veículo</th>
<th>Descrição</th>
<th>Status</th>
<th>Valor</th>
<th class="text-end">Ações</th>
</tr>
</thead>
<tbody id="listaOrdensServico"></tbody>
</table>
</div>
</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/frontend/js/navigation.js"></script>
<script src="/frontend/js/auth.js"></script>
<script src="/frontend/js/ordemServico.js"></script>
</body>
</html>
