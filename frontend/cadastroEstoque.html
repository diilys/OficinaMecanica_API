<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Peça - VibeMechanics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg fixed-top shadow-sm py-1" style="background-color: #5381FF; z-index: 1060;">
        <div class="container-fluid px-4">
            <div class="row w-100 align-items-center m-0">
                <div class="col-4 d-flex align-items-center">
                    <a href="/frontend/estoque.html" class="btn text-white p-0 fs-5 border-0 shadow-none d-flex align-items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> <span class="d-none d-sm-inline">Voltar</span>
                    </a>
                </div>
                <div class="col-4 text-center">
                    <a class="navbar-brand fw-bold fs-3 brand-title m-0" href="/">
                        <span style="color: #ffffff;">Vibe</span><span style="color: #323232;">Mechanics</span>
                    </a>
                </div>
                <div class="col-4"></div>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 90px; margin-bottom: 50px; max-width: 500px;">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 id="tituloFormulario" class="fw-bold mb-4" style="color: #5381FF;">Nova Peça / Item</h3>
                
                <form id="form-estoque">
                    <input type="hidden" id="estoque_id">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="color: #323232;">Nome da Peça / Item</label>
                        <input type="text" id="nome_peca" class="form-control" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold" style="color: #323232;">Quantidade</label>
                            <input type="number" id="quantidade" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-semibold" style="color: #323232;">Preço Unitário (R$)</label>
                            <input type="number" step="0.01" id="preco" class="form-control" min="0" required>
                        </div>
                    </div>

                    <button type="submit" id="btnSalvarEstoque" class="btn text-white w-100 fw-bold py-2 shadow-sm" style="background-color: #F97316;">Salvar Item</button>
                    
                    <div id="mensagemEstoque" class="text-danger mt-3 text-center fw-bold"></div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/estoque.js"></script>
</body>
</html>
