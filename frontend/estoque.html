<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - Oficina Mecânica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Oficina Mecânica</a>
            <div>
                <a href="/" class="btn btn-light btn-sm me-2">Início</a>
                <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#modalItemEstoque" onclick="limparFormularioEstoque()">+ Nova Peça</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold m-0">Controle de Estoque</h1>
                <p class="text-muted m-0">Gerencie peças e suprimentos cadastrados na oficina.</p>
            </div>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalItemEstoque" onclick="limparFormularioEstoque()">+ Cadastrar Peça</button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Nome da Peça</th>
                                <th>Quantidade</th>
                                <th>Preço Unitário (R$)</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaEstoque">
                            <!-- Preenchido via estoque.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalItemEstoque" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalEstoqueTitulo">Cadastrar Peça</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form id="form-estoque">
                        <input type="hidden" id="estoque_id">
                        <div class="mb-3">
                            <label for="nome_peca" class="form-label">Nome da Peça / Item</label>
                            <input type="text" id="nome_peca" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="quantidade" class="form-label">Quantidade</label>
                                <input type="number" id="quantidade" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="preco" class="form-label">Preço Unitário</label>
                                <input type="number" step="0.01" id="preco" class="form-control" min="0" required>
                            </div>
                        </div>
                        <div id="mensagemEstoque" class="text-danger mb-3 text-center fw-bold"></div>
                        <button type="submit" class="btn btn-primary w-100" id="btnSalvarEstoque">Salvar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/estoque.js"></script>
</body>
</html>
