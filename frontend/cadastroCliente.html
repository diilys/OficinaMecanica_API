<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - VibeMechanics</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegação Fixa com Botão Voltar à Esquerda e Logo Centralizada -->
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm py-2" style="background-color: #5381FF;">
        <div class="container-fluid px-4">
            <div class="d-flex w-100 align-items-center justify-content-between position-relative">
                
                <!-- Botão Voltar na Extremidade Esquerda com Seta Branca -->
                <div>
                    <a href="/" class="text-white text-decoration-none fw-semibold d-inline-flex align-items-center gap-2">
                        <i class="fa-solid fa-arrow-left text-white"></i> Voltar
                    </a>
                </div>

                <!-- Logo Perfeitamente Centralizada -->
                <div class="position-absolute start-50 translate-middle-x">
                    <a class="navbar-brand fw-bold fs-3 brand-title m-0" href="#">
                        <span style="color: #ffffff;">Vibe</span><span style="color: #323232;">Mechanics</span>
                    </a>
                </div>

                <!-- Elemento invisível à direita para manter o balanceamento do flex -->
                <div style="visibility: hidden;">
                    <span class="fw-semibold">Voltar</span>
                </div>

            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal do Cadastro -->
    <main class="container py-4" style="max-width: 550px; margin-top: 80px;">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 id="tituloFormulario" class="fw-bold mb-4 text-center">Criar Nova Conta</h3>
                
                <form id="form-cliente">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" id="nome" class="form-control" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" id="senha" class="form-control" placeholder="Digite uma senha segura" required>
                    </div>

                    <div class="mb-4">
                        <label for="confirma-senha" class="form-label">Confirmar Senha</label>
                        <input type="password" id="confirma-senha" class="form-control" placeholder="Digite a senha novamente" required>
                    </div>

                    <button type="submit" id="btnSalvar" class="btn text-white w-100 fw-bold py-2" style="background-color: #F97316;">Cadastrar Conta</button>
                    
                    <div id="mensagem" class="text-danger mt-3 text-center fw-bold"></div>
                </form>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Principal Separado -->
    <script src="/frontend/js/cliente.js"></script>
</body>
</html>
