<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Oficina Mecânica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Oficina Mecânica</a>
            <div>
                <a href="/" class="btn btn-light btn-sm me-2">Início</a>
                <a href="/frontend/cadastroCliente.html" class="btn btn-light btn-sm">+ Novo Cliente</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold m-0">Clientes Cadastrados</h1>
                <p class="text-muted m-0">Consulte e gerencie os clientes registrados na oficina.</p>
            </div>
            <a href="/frontend/cadastroCliente.html" class="btn btn-primary">+ Cadastrar Cliente</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>E-mail</th>
                                <th>Ações</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="listaClientes">
                            <!-- Preenchido via cliente.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/cliente.js"></script>
</body>
</html>
