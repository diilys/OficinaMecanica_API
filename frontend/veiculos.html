<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos - VibeMechanics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg fixed-top shadow-sm py-1" style="background-color: #5381FF; z-index: 1060;">
        <div class="container-fluid px-4">
            <div class="row w-100 align-items-center m-0">
                <div class="col-4 d-flex align-items-center">
                    <a href="/painel-admin" class="btn text-white p-0 fs-5 border-0 shadow-none d-flex align-items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> <span class="d-none d-sm-inline">Voltar</span>
                    </a>
                </div>
                <div class="col-4 text-center">
                    <a class="navbar-brand fw-bold fs-3 brand-title m-0" href="/">
                        <span style="color: #ffffff;">Vibe</span><span style="color: #323232;">Mechanics</span>
                    </a>
                </div>
                <div class="col-4 text-end">
                    <a href="/cadastro-veiculo" class="btn text-white fw-bold shadow-sm" style="background-color: #F97316;">
                        <i class="fa-solid fa-plus me-1"></i> <span class="d-none d-sm-inline">Novo Veículo</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4" style="margin-top: 90px;">
        <div class="mb-4">
            <h1 class="fw-bold m-0" style="color: #323232;">Gerenciamento de Veículos</h1>
            <p class="text-muted m-0">Consulte e gerencie a frota de veículos cadastrados na oficina.</p>
        </div>

        <!-- CARD DE FILTRAGEM -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <h5 class="card-title fw-bold mb-3" style="color: #323232;">
                    <i class="fa-solid fa-magnifying-glass me-2" style="color: #5381FF;"></i>Filtrar Veículos
                </h5>
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="campoFiltro" class="form-label fw-semibold">Filtrar por</label>
                        <select id="campoFiltro" class="form-select">
                            <option value="placa">Placa</option>
                            <option value="modelo">Modelo</option>
                            <option value="marca">Marca</option>
                            <option value="cliente_nome">Nome do Cliente</option>
                        </select>
                    </div>
                    <div class="col-md-7">
                        <label for="textoFiltro" class="form-label fw-semibold">Pesquisar</label>
                        <input type="text" id="textoFiltro" class="form-control" placeholder="Digite para filtrar...">
                    </div>
                    <div class="col-md-2">
                        <button type="button" id="btnLimparFiltro" class="btn btn-secondary w-100 fw-bold">Limpar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead style="background-color: #5381FF; color: #ffffff;">
                            <tr>
                                <th>ID</th>
                                <th>Placa</th>
                                <th>Marca / Modelo</th>
                                <th>Ano</th>
                                <th>Cliente</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaVeiculos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/veiculo.js"></script>
</body>
</html>
