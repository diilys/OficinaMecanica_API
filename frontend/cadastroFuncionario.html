<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Funcionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Oficina Mecânica</a>
            <a href="/frontend/funcionarios.html" class="btn btn-light btn-sm">Voltar</a>
        </div>
    </nav>
    <main class="container py-4" style="max-width: 600px;">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 id="tituloFormulario" class="fw-bold mb-4">Novo Funcionário</h3>
                <form id="form-funcionario">
                    <div class="mb-3">
                        <label>Nome Completo</label>
                        <input type="text" id="nome" class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>CPF</label>
                            <input type="text" id="cpf" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Telefone</label>
                            <input type="text" id="telefone" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Cargo</label>
                            <input type="text" id="cargo" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Estado Civil</label>
                            <input type="text" id="estado_civil" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>Endereço</label>
                        <input type="text" id="endereco" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>E-mail</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label>Senha</label>
                        <input type="password" id="senha" class="form-control" required>
                    </div>
                    <button type="submit" id="btnSalvar" class="btn btn-success w-100">Cadastrar</button>
                    <div id="mensagem" class="text-danger mt-3 text-center fw-bold"></div>
                </form>
            </div>
        </div>
    </main>
    <script src="/frontend/js/funcionario.js"></script>
</body>
</html>
