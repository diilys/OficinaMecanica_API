<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMechanics - Cadastro de Veículo</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegação Fixa (Padrão VibeMechanics) -->
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm py-1" style="background-color: #5381FF; z-index: 1060;">
        <div class="container-fluid px-4">
            <div class="row w-100 align-items-center m-0">
                <!-- Coluna Esquerda: Botão Voltar -->
                <div class="col-4 d-flex align-items-center">
                    <a href="/frontend/veiculos.html" class="btn text-white p-0 fs-5 border-0 shadow-none d-flex align-items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> <span class="d-none d-sm-inline">Voltar</span>
                    </a>
                </div>

                <!-- Coluna Central: Nome da Marca -->
                <div class="col-4 text-center">
                    <a class="navbar-brand fw-bold fs-3 brand-title m-0" href="/">
                        <span style="color: #ffffff;">Vibe</span><span style="color: #323232;">Mechanics</span>
                    </a>
                </div>

                <!-- Coluna Direita: Área de Autenticação Dinâmica -->
                <div id="area-auth" class="col-4 d-flex justify-content-end gap-2">
                    <a href="/login" class="btn btn-light px-3 py-1 fw-semibold text-primary">Login</a>
                    <a href="/cadastro-cliente" class="btn btn-outline-light px-3 py-1 fw-semibold">Cadastro</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Corpo com margem superior clara para separar da navbar fixa -->
    <main class="container" style="margin-top: 90px; margin-bottom: 50px; max-width: 500px;">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 id="tituloFormulario" class="fw-bold mb-4" style="color: #5381FF;">Novo Veículo</h3>
                
                <form id="form-veiculo">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">Placa</label>
                        <input type="text" id="placa" class="form-control" style="text-transform: uppercase;" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold text-secondary">Marca</label>
                            <input type="text" id="marca" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold text-secondary">Modelo</label>
                            <input type="text" id="modelo" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-semibold text-secondary">Ano</label>
                            <input type="number" id="ano" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-semibold text-secondary">ID do Cliente Dono</label>
                            <input type="number" id="cliente_id" class="form-control" required>
                        </div>
                    </div>

                    <!-- Botão com a cor padrão #F97316 do VibeMechanics -->
                    <button type="submit" id="btnSalvar" class="btn text-white fw-bold w-100 py-2 shadow-sm" style="background-color: #F97316;">Cadastrar</button>
                    
                    <div id="mensagem" class="mt-3 text-center fw-bold"></div>
                </form>
            </div>
        </div>
    </main>

    <!-- Script de Controle de Sessão na Navbar -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const usuarioSalvo = localStorage.getItem("usuarioLogado");
            const areaAuth = document.getElementById("area-auth");
            
            if (usuarioSalvo) {
                const usuario = JSON.parse(usuarioSalvo);
                areaAuth.innerHTML = `
                    <div class="d-flex align-items-center gap-2 text-white justify-content-end">
                        <span class="fw-semibold small text-truncate" style="max-width: 130px;"><i class="fa-solid fa-user me-1"></i> ${usuario.nome}</span>
                        <button onclick="fazerLogout()" class="btn btn-outline-light btn-sm fw-semibold py-0 px-2">Sair</button>
                    </div>
                `;
            }
        });

        function fazerLogout() {
            localStorage.removeItem("usuarioLogado");
            window.location.reload();
        }
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script JavaScript do Veículo -->
    <script src="/frontend/js/veiculo.js"></script>
</body>
</html>
