<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VibeMechanics - Cadastro de Veículo</title>
<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<!-- FontAwesome para ícones -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="/frontend/css/estilo.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<!-- Barra de Navegação Fixa (Padrão VibeMechanics) -->
<nav class="navbar navbar-expand-lg fixed-top shadow-sm py-1 inline-style-1">
<div class="container-fluid px-4">
<div class="row w-100 align-items-center m-0">
<!-- Coluna Esquerda: Botão Voltar -->
<div class="col-4 d-flex align-items-center">
<a class="btn text-white p-0 fs-5 border-0 shadow-none d-flex align-items-center gap-2" data-fallback="/" data-voltar="" href="#">
<i class="fa-solid fa-arrow-left"></i> <span class="d-none d-sm-inline">Voltar</span>
</a>
</div>
<!-- Coluna Central: Nome da Marca -->
<div class="col-4 text-center">
<a class="navbar-brand fw-bold fs-3 brand-title m-0" href="/">
<span class="inline-style-2">Vibe</span><span class="inline-style-3">Mechanics</span>
</a>
</div>
<!-- Coluna Direita: Área de Autenticação Dinâmica -->
<div class="col-4 d-flex justify-content-end gap-2" id="area-auth">
<a class="btn btn-light px-3 py-1 fw-semibold text-primary" href="/login">Login</a>
<a class="btn btn-outline-light px-3 py-1 fw-semibold" href="/cadastro-cliente">Cadastro</a>
</div>
</div>
</div>
</nav>
<!-- Corpo com margem superior clara para separar da navbar fixa -->
<main class="container inline-style-8">
<div class="card shadow border-0">
<div class="card-body p-4">
<h3 class="fw-bold mb-4 inline-style-6" id="tituloFormulario">Novo Veículo</h3>
<form id="form-veiculo">
<div class="mb-3">
<label class="form-label fw-semibold text-secondary">Placa</label>
<input class="form-control inline-style-9" id="placa" required="" type="text"/>
</div>
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label fw-semibold text-secondary">Marca</label>
<input class="form-control" id="marca" required="" type="text"/>
</div>
<div class="col-md-6 mb-3">
<label class="form-label fw-semibold text-secondary">Modelo</label>
<input class="form-control" id="modelo" required="" type="text"/>
</div>
</div>
<div class="row">
<div class="col-md-6 mb-4">
<label class="form-label fw-semibold text-secondary">Ano</label>
<input class="form-control" id="ano" required="" type="number"/>
</div>
<div class="col-md-6 mb-4">
<label class="form-label fw-semibold text-secondary">ID do Cliente Dono</label>
<input class="form-control" id="cliente_id" required="" type="number"/>
</div>
</div>
<!-- Botão com a cor padrão #F97316 do VibeMechanics -->
<button class="btn text-white fw-bold w-100 py-2 shadow-sm inline-style-4" id="btnSalvar" type="submit">Cadastrar</button>
<div class="mt-3 text-center fw-bold" id="mensagem"></div>
</form>
</div>
</div>
</main>
<!-- Script de Controle de Sessão na Navbar -->
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script JavaScript do Veículo -->
<script src="/frontend/js/navigation.js"></script><script src="/frontend/js/auth.js"></script><script src="/frontend/js/veiculo.js"></script>
</body>
</html>
