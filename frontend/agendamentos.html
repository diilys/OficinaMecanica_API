```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciar Agendamentos - VibeMechanics</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        rel="stylesheet"
    >

    <!-- CSS do projeto -->
    <link
        href="/frontend/css/estilo.css"
        rel="stylesheet"
    >
</head>


<body class="bg-light">

    <!-- =========================================================
         NAVBAR
         Mesmo padrão utilizado em clientes.html
         ========================================================= -->

    <nav class="navbar navbar-expand-lg fixed-top shadow-sm py-1 inline-style-1">

        <div class="container-fluid px-4">

            <div class="row w-100 align-items-center m-0">


                <!-- ESQUERDA: VOLTAR -->

                <div class="col-4 d-flex align-items-center">

                    <a
                        class="btn text-white p-0 fs-5 border-0 shadow-none d-flex align-items-center gap-2"
                        data-fallback="/painel-admin"
                        data-voltar
                        href="#"
                    >
                        <i class="fa-solid fa-arrow-left"></i>

                        <span class="d-none d-sm-inline">
                            Voltar
                        </span>
                    </a>

                </div>


                <!-- CENTRO: LOGO -->

                <div class="col-4 text-center">

                    <a
                        class="navbar-brand fw-bold fs-3 brand-title m-0"
                        href="/"
                    >
                        <span class="inline-style-2">Vibe</span><span class="inline-style-3">Mechanics</span>
                    </a>

                </div>


                <!-- DIREITA
                     Agendamentos não possui botão "Novo",
                     pois o agendamento é criado pelo cliente. -->

                <div class="col-4 text-end">

                </div>


            </div>

        </div>

    </nav>


    <!-- =========================================================
         CONTEÚDO PRINCIPAL
         ========================================================= -->

    <main class="container py-4 inline-style-5">


        <!-- TÍTULO -->

        <div class="mb-4">

            <h1 class="fw-bold m-0 inline-style-3">
                Gerenciamento de Agendamentos
            </h1>

            <p class="text-muted m-0">
                Consulte os agendamentos e altere seus status.
            </p>

        </div>


        <!-- =====================================================
             MENSAGEM
             ===================================================== -->

        <div
            id="mensagemAgendamentos"
            class="alert d-none"
            role="alert"
        ></div>


        <!-- =====================================================
             FILTROS
             ===================================================== -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <h5 class="card-title fw-bold mb-3 inline-style-3">

                    <i class="fa-solid fa-magnifying-glass me-2 inline-style-6"></i>

                    Filtrar Agendamentos

                </h5>


                <div class="row g-3 align-items-end">


                    <!-- PESQUISA -->

                    <div class="col-md-8">

                        <label
                            for="pesquisaAgendamento"
                            class="form-label fw-semibold"
                        >
                            Pesquisar
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="pesquisaAgendamento"
                            placeholder="Cliente, placa ou veículo..."
                        >

                    </div>


                    <!-- STATUS -->

                    <div class="col-md-4">

                        <label
                            for="filtroStatusAgendamento"
                            class="form-label fw-semibold"
                        >
                            Status
                        </label>

                        <select
                            id="filtroStatusAgendamento"
                            class="form-select"
                        >

                            <option value="">
                                Todos
                            </option>

                            <option value="pendente">
                                Pendente
                            </option>

                            <option value="confirmado">
                                Confirmado
                            </option>

                            <option value="concluido">
                                Concluído
                            </option>

                            <option value="cancelado">
                                Cancelado
                            </option>

                        </select>

                    </div>


                </div>

            </div>

        </div>


        <!-- =====================================================
             TABELA
             ===================================================== -->

        <div class="card shadow-sm border-0">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="inline-style-7">

                            <tr>

                                <th>
                                    Cliente
                                </th>

                                <th>
                                    Veículo
                                </th>

                                <th>
                                    Data
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Observações
                                </th>

                            </tr>

                        </thead>


                        <tbody id="listaAgendamentos">

                            <tr>

                                <td
                                    colspan="5"
                                    class="text-center text-muted py-4"
                                >
                                    Carregando agendamentos...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


    </main>


    <!-- =========================================================
         SCRIPTS
         ========================================================= -->

    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Navegação -->
    <script src="/frontend/js/navigation.js"></script>

    <!-- Autenticação -->
    <script src="/frontend/js/auth.js"></script>

    <!-- Agendamentos -->
    <script src="/frontend/js/agendamento.js"></script>

</body>

</html>
```
