<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ordem de Serviço - VibeMechanics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="/frontend/css/estilo.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar fixed-top shadow-sm py-1 bg-brand-blue z-navbar">
<div class="container-fluid px-4"><div class="row w-100 align-items-center m-0">
<div class="col-4"><a class="btn text-white p-0 fs-5 border-0" data-fallback="/painel-ordens" data-voltar="" href="#"><i class="fa-solid fa-arrow-left"></i> <span class="d-none d-sm-inline">Voltar</span></a></div>
<div class="col-4 text-center"><a class="navbar-brand fw-bold fs-3 m-0" href="/"><span class="brand-light">Vibe</span><span class="brand-dark">Mechanics</span></a></div>
<div class="col-4 text-end"></div>
</div></div>
</nav>

<main class="container form-container-800">
<div class="card shadow border-0 mb-4"><div class="card-body p-4">
<h3 class="fw-bold section-title" id="tituloOS">Nova Ordem de Serviço</h3>
<form class="row g-3" id="form-os">
<div class="col-md-6"><label class="form-label" for="veiculo_id">Veículo</label><select class="form-select" id="veiculo_id" required><option value="">Selecione um veículo</option></select></div>
<div class="col-md-6"><label class="form-label" for="funcionario_id">Funcionário responsável</label><select class="form-select" id="funcionario_id"><option value="">Não definido</option></select></div>
<div class="col-12"><label class="form-label" for="descricao">Descrição / defeito</label><textarea class="form-control" id="descricao" required rows="3"></textarea></div>
<div class="col-md-6"><label class="form-label" for="valor_base">Valor da OS</label><input class="form-control" id="valor_base" min="0" step="0.01" type="number" value="0"/></div>
<div class="col-md-6"><label class="form-label" for="status">Status</label><select class="form-select" id="status"><option value="pendente">Pendente</option><option value="em_andamento">Em andamento</option><option value="concluida">Concluída</option><option value="cancelada">Cancelada</option></select></div>
<div class="col-12"><label class="form-label" for="observacoes">Observações</label><textarea class="form-control" id="observacoes" rows="2"></textarea></div>
<div class="col-12"><button class="btn btn-brand fw-bold" id="btnSalvarOS" type="submit">Cadastrar Ordem de Serviço</button></div>
</form>
</div></div>

<div id="detalhesOS">
<div class="row g-4">
<div class="col-lg-6"><div class="card shadow-sm border-0 h-100"><div class="card-body">
<h5 class="fw-bold">Peças <small class="text-muted fw-normal">(opcional)</small></h5>
<div class="input-group mb-3"><select class="form-select" id="peca_os"></select><input class="form-control" id="peca_quantidade" min="1" type="number" value="1"/><button class="btn btn-brand" id="btnAdicionarPeca" type="button">Adicionar</button></div>
<div class="os-item-list" id="listaPecasOS"></div>
</div></div></div>
<div class="col-lg-6"><div class="card shadow-sm border-0 h-100"><div class="card-body">
<h5 class="fw-bold">Serviços <small class="text-muted fw-normal">(opcional)</small></h5>
<div class="input-group mb-3"><select class="form-select" id="servico_os"></select><button class="btn btn-brand" id="btnAdicionarServico" type="button">Adicionar</button></div>
<div class="os-item-list" id="listaServicosOS"></div>
</div></div></div>
</div>

<div class="card shadow-sm border-0 mt-4"><div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
<div><span class="text-muted">Total da OS</span><div class="summary-value" id="totalOS">R$ 0,00</div></div>
<button class="btn btn-success fw-bold" id="btnFinalizarOS" type="button">Finalizar OS</button>
</div></div>

</div>

<!-- Modal exibido somente após confirmar a intenção de finalizar a OS -->
<div aria-hidden="true" aria-labelledby="tituloModalPagamento" class="modal fade" id="modalPagamentoOS" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content border-0 shadow">
<div class="modal-header">
<h5 class="modal-title fw-bold" id="tituloModalPagamento">Finalizar Ordem de Serviço</h5>
<button aria-label="Fechar" class="btn-close" data-bs-dismiss="modal" type="button"></button>
</div>
<div class="modal-body">
<p class="text-muted mb-3">Selecione a forma de pagamento para concluir a ordem de serviço.</p>
<div class="mb-3">
<label class="form-label fw-semibold" for="pagamento_metodo">Forma de pagamento</label>
<select class="form-select" id="pagamento_metodo">
<option value="pix">PIX</option>
<option value="dinheiro">Dinheiro</option>
<option value="credito">Crédito</option>
<option value="debito">Débito</option>
<option value="outro">Outro</option>
</select>
</div>
<div class="d-flex justify-content-between align-items-center border-top pt-3">
<span class="fw-semibold">Valor total</span>
<span class="fw-bold fs-5" id="valorPagamentoModal">R$ 0,00</span>
</div>
</div>
<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
<button class="btn btn-success fw-bold" id="btnConfirmarFinalizacao" type="button">
<i class="fa-solid fa-check me-1"></i> Confirmar pagamento e finalizar
</button>
</div>
</div>
</div>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/frontend/js/navigation.js"></script>
<script src="/frontend/js/auth.js"></script>
<script src="/frontend/js/ordemServico.js"></script>
</body>
</html>
